<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="'Microsoft YaHei','SimHei',sans-serif">
  <rect x="0" y="0" width="1200" height="640" fill="#FAFAFA"/>
  <rect x="0" y="0" width="1200" height="60" fill="#1A73E8"/>
  <rect x="0" y="56" width="1200" height="4" fill="#0B57D0"/>
  <text x="28" y="39" font-size="22" font-weight="bold" fill="#FFFFFF">图 7  协作图 —— DDL 识别 → 确认 → 同步待办</text>
  <text x="1172" y="39" font-size="13" fill="#D2E3FC" text-anchor="end">对象协作 · 编号消息顺序 · 经 MCP add_todo</text>

  <defs>
    <marker id="ca" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#37474F"/></marker>
    <marker id="cd" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#5F6368"/></marker>
  </defs>

  <!-- ===== 消息连线（箭头） ===== -->
  <g fill="none" stroke="#37474F" stroke-width="2" marker-end="url(#ca)">
    <!-- 1 上传 -->
    <line x1="190" y1="197" x2="330" y2="197"/>
    <!-- 1 续 提交解析 -->
    <line x1="480" y1="197" x2="620" y2="197"/>
    <!-- 2 正则匹配 -->
    <line x1="790" y1="197" x2="930" y2="197"/>
    <!-- 3 标记 is_ddl -->
    <line x1="1005" y1="224" x2="1005" y2="470"/>
    <!-- 4 弹窗确认 -->
    <line x1="930" y1="497" x2="790" y2="497"/>
    <!-- 5 调用 add_todo -->
    <line x1="620" y1="497" x2="500" y2="497"/>
    <!-- 6 写入待办 -->
    <line x1="330" y1="497" x2="220" y2="497"/>
  </g>
  <!-- 返回消息（虚线） -->
  <line x1="140" y1="470" x2="125" y2="224" fill="none" stroke="#5F6368" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#cd)"/>

  <!-- ===== 消息标签（编号顺序） ===== -->
  <g font-size="12" fill="#202124">
    <text x="260" y="189" text-anchor="middle">1. 上传 PDF/PPTX</text>
    <text x="550" y="189" text-anchor="middle">1(续). 提交解析</text>
    <text x="860" y="189" text-anchor="middle">2. 正则匹配日期句式</text>
    <text x="995" y="355" text-anchor="end">3. 标记 is_ddl = true</text>
    <text x="860" y="489" text-anchor="middle">4. 弹窗确认</text>
    <text x="560" y="489" text-anchor="middle">5. 调用 add_todo</text>
    <text x="275" y="489" text-anchor="middle">6. 写入待办</text>
    <text x="150" y="350" text-anchor="start" font-size="12" fill="#5F6368">返回：待办已同步</text>
  </g>

  <!-- ===== 参与者/对象框 ===== -->
  <!-- 用户 -->
  <rect x="60" y="170" width="130" height="54" rx="8" fill="#E8F0FE" stroke="#1A73E8" stroke-width="2"/>
  <text x="125" y="195" font-size="13" font-weight="bold" fill="#202124" text-anchor="middle">用户</text>
  <text x="125" y="213" font-size="12" fill="#5F6368" text-anchor="middle">: Actor</text>

  <!-- UploadView -->
  <rect x="330" y="170" width="150" height="54" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="2"/>
  <text x="405" y="195" font-size="12.5" font-weight="bold" fill="#202124" text-anchor="middle">uploadView</text>
  <text x="405" y="213" font-size="12" fill="#5F6368" text-anchor="middle">: UploadView</text>

  <!-- MaterialController -->
  <rect x="620" y="170" width="170" height="54" rx="8" fill="#FEF7E0" stroke="#F9AB00" stroke-width="2"/>
  <text x="705" y="195" font-size="12.5" font-weight="bold" fill="#202124" text-anchor="middle">materialController</text>
  <text x="705" y="213" font-size="12" fill="#5F6368" text-anchor="middle">: MaterialController</text>

  <!-- DdlExtractor -->
  <rect x="930" y="170" width="150" height="54" rx="8" fill="#F3E8FD" stroke="#9334E6" stroke-width="2"/>
  <text x="1005" y="195" font-size="12.5" font-weight="bold" fill="#202124" text-anchor="middle">ddlExtractor</text>
  <text x="1005" y="213" font-size="12" fill="#5F6368" text-anchor="middle">: DdlExtractor</text>

  <!-- Page -->
  <rect x="930" y="470" width="140" height="54" rx="8" fill="#E0F7FA" stroke="#00ACC1" stroke-width="2"/>
  <text x="1000" y="495" font-size="12.5" font-weight="bold" fill="#202124" text-anchor="middle">page</text>
  <text x="1000" y="513" font-size="12" fill="#5F6368" text-anchor="middle">: Page (is_ddl)</text>

  <!-- DdlConfirmView -->
  <rect x="620" y="470" width="170" height="54" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="2"/>
  <text x="705" y="495" font-size="12.5" font-weight="bold" fill="#202124" text-anchor="middle">ddlConfirmView</text>
  <text x="705" y="513" font-size="12" fill="#5F6368" text-anchor="middle">: DdlConfirmView</text>

  <!-- TodoController -->
  <rect x="330" y="470" width="170" height="54" rx="8" fill="#FEF7E0" stroke="#F9AB00" stroke-width="2"/>
  <text x="415" y="495" font-size="12.5" font-weight="bold" fill="#202124" text-anchor="middle">todoController</text>
  <text x="415" y="513" font-size="12" fill="#5F6368" text-anchor="middle">: TodoController</text>

  <!-- Todo -->
  <rect x="60" y="470" width="160" height="54" rx="8" fill="#E0F7FA" stroke="#00ACC1" stroke-width="2"/>
  <text x="140" y="495" font-size="12.5" font-weight="bold" fill="#202124" text-anchor="middle">todo</text>
  <text x="140" y="513" font-size="12" fill="#5F6368" text-anchor="middle">: Todo (MCP add_todo)</text>

  <!-- ===== 阶段说明 ===== -->
  <g font-size="12" fill="#5F6368">
    <rect x="60" y="560" width="1080" height="50" rx="8" fill="#F1F3F4" stroke="#DADCE0"/>
    <text x="75" y="580">识别链：上传 → 正则匹配日期句式 → 标记 is_ddl → 弹窗确认</text>
    <text x="75" y="598">同步链：用户确认 → 调用 MCP add_todo → 写入 Todo（与第一版待办闭环）；虚线为结果显示返回</text>
  </g>
</svg>
